<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="secondtake terminal showcase">
  <rect width="960" height="540" fill="#070B12"/>
  <rect x="12" y="12" width="936" height="516" rx="14" fill="#0D131F" stroke="#1E293B" stroke-width="2"/>
  <path d="M 26 12 H 934 A 14 14 0 0 1 948 26 V 50 H 12 V 26 A 14 14 0 0 1 26 12 Z" fill="#131C2E"/>
  <line x1="12" y1="50" x2="948" y2="50" stroke="#1E293B" stroke-width="1"/>
  <circle cx="32" cy="31" r="6" fill="#EF4444"/>
  <circle cx="52" cy="31" r="6" fill="#F59E0B"/>
  <circle cx="72" cy="31" r="6" fill="#10B981"/>
  <text x="106" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">secondtake  --  verified CLI capture  (45 / 100 rounds)</text>
  <rect x="24" y="68" width="912" height="25" rx="5" fill="#152036"/>
  <text x="34" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#F8FAFC">$ secondtake compare examples/before examples/after --registration examples/registration.json</text>
  <text x="34" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#34D399">{ &quot;registration&quot;: { &quot;change&quot;: &quot;tighten edit retry rule in AGENTS.md&quot;, &quot;min_pairs&quot;: 1 },</text>
  <text x="34" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#94A3B8">  &quot;matching_rule&quot;: &quot;canonical form 1 digest of first main-chain user message&quot;,</text>
  <text x="34" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">  &quot;pairs&quot;: [{ &quot;key&quot;: &quot;ac3c7df17a5e22f8...&quot;, &quot;before_file&quot;: &quot;session.json&quot;, &quot;after_file&quot;: &quot;session.json&quot;,</text>
  <text x="34" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#34D399">              &quot;deltas&quot;: { &quot;cost&quot;: -10, &quot;time_seconds&quot;: 0.0, &quot;rework&quot;: 0 } }],</text>
  <text x="34" y="239" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">  &quot;aggregates&quot;: { &quot;pairs&quot;: 1, &quot;cost&quot;: { &quot;before_mean&quot;: 200.0, &quot;after_mean&quot;: 190.0, &quot;delta_pct&quot;: -5.0 },</text>
  <text x="34" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#E2E8F0">                  &quot;time&quot;: { &quot;delta_pct&quot;: 0.0 }, &quot;rework&quot;: { &quot;delta&quot;: 0.0 }, &quot;regressions&quot;: [] },</text>
  <text x="34" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#34D399">  &quot;proposal&quot;: &quot;keep&quot;,</text>
  <text x="34" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#94A3B8">  &quot;judgment&quot;: { &quot;status&quot;: &quot;not_consulted&quot;, &quot;reason&quot;: &quot;the deterministic rule is conclusive&quot; } }</text>
  <rect x="24" y="347" width="912" height="25" rx="5" fill="#152036"/>
  <text x="34" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="600" fill="#F8FAFC">$ secondtake compare examples/before examples/after --registration examples/registration.json -o examples/before/out.json</text>
  <text x="34" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" fill="#F87171">error, secondtake writes nothing inside the tape sets it reads   [exit 1]</text>
  <line x1="12" y1="492" x2="948" y2="492" stroke="#1E293B" stroke-width="1"/>
  <circle cx="32" cy="510" r="4.5" fill="#10B981"/>
  <text x="44" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#34D399">KEEP VERDICT  |  683.2 KiB LTO binary  |  500 tapes (250 pairs) scored in 314.04 ms (1,592 tapes/s)</text>
</svg>
