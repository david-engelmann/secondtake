name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          STEM="secondtake-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${STEM}"
          cp "target/${TARGET}/release/secondtake" "dist/${STEM}/secondtake"
          cp README.md LICENSE "dist/${STEM}/"
          tar -C dist -czf "dist/${STEM}.tar.gz" "${STEM}"
          rm -rf "dist/${STEM}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $Stem = "secondtake-$env:RELEASE_TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$Stem" | Out-Null
          Copy-Item "target/$env:TARGET/release/secondtake.exe" "dist/$Stem/secondtake.exe"
          Copy-Item README.md "dist/$Stem/README.md"
          Copy-Item LICENSE "dist/$Stem/LICENSE"
          Compress-Archive -Path "dist/$Stem" -DestinationPath "dist/$Stem.zip" -Force
          Remove-Item -Recurse -Force "dist/$Stem"
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/secondtake-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum secondtake-* > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" secondtake-* SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" secondtake-* SHA256SUMS               --title "secondtake ${RELEASE_TAG}"               --generate-notes
          fi
