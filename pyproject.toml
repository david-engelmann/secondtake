[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondtake"
version = "0.1.0"
description = "Before and after tapes, matched by task and compared on four measures"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
secondtake = "secondtake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
